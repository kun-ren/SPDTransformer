# Subject-specific MDM; same preprocessing as mdm_physionet.yaml.
# Train only on the current subject's other runs; no global pretraining.
data:
  dataset: ["physionet_mi"]
  root_dir: ["data/MNE-eegbci-data/files/eegmmidb/1.0.0"]

  # Same retained subject cohort as the 11x9 reference.
  subjects: 1-87,90-91,93-99,101-103,105,107-109
  # Exclude S088, S089, S092, S100, S104, and S106.

  # As in train_grid.yaml, one filter-bank candidate needs an extra list level.
  filter_bank: [[[5, 13], [13, 20], [20, 35]]]
  estimator: ["lwf"]
  sfreq: [160]
  eps: [1.0e-6]
  covariance_signal_scale: ["auto"]
  replace_covariance_diagonal_with_raw_energy: [true]
  # Baselines retain full 64-channel spatial coordinates, not region tokens.
  brain_region_mode: [null]
  covariance_output_dtype: ["float32"]
  channels: [null]

  imaged: [true]
  executed: [false]
  # Use [[unilateral_fist]] for two classes, or the setting below for four.
  task_types: [[unilateral_fist]]

  # Paired time fields follow train_grid.yaml's grid syntax.
  epoch_slice: [[-1.5, 3.5]]
  segment_slice: [[0.5, 0.25]]

  reject_threshold_uv: [null]
  use_ica: [false]
  ica_n_components: [20]
  ica_random_state: [42]
  ica_eog_channels: [""]
  use_autoreject: [false]
  autoreject_random_state: [42]
  autoreject_n_jobs: [1]
  autoreject_cv: [10]
  autoreject_cache_dir: "experiments/cache/autoreject_masks"
  autoreject_force_rebuild: false
  baseline_correction: [null]
  baseline_window: [null]

model:
  # Preprocessing-matched MDM: fixed log mean of segment/filter-bank tokens.
  # Class centroids and prediction distances still use AIRM.
  classifier_type: ["pyriemann"]
  pooling: ["mean"]
  token_weight_logits: null
  metric_mean: ["riemann"]
  metric_distance: ["riemann"]
  n_jobs: [1]

training:
  seed: [42]
  n_splits: [5]
  subject_specific: [true]
  subject_split_strategy: ["leave_one_run_out"]
  held_out_run_validation_size: [0.0]
  allow_subject_overlap: [true]
  val_size: [0.0]
  split_file: null

output:
  dir: experiments/results/mdm_subject_specific_run_loo_physionet_aligned
  dataset_cache_dir: experiments/cache/mdm_preprocessed_datasets
