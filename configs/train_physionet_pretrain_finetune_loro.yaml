# One Global checkpoint followed by nested held-out-subject adaptation.
# First split data.subjects into configurable Global-train/Global-test subject
# cohorts. Then evaluate the Global checkpoint and adapt it independently to
# each Global-test subject using a configurable pooled-trial train/test split.

data:
  dataset: ["physionet_mi"]
  root_dir: ["data/MNE-eegbci-data/files/eegmmidb/1.0.0"]

  # Complete subject cohort. The subject split is configured under pretrain.
  subjects: 1-87,90-91,93-99,101-103,105,107-109

  # As in train_grid.yaml, one filter-bank candidate needs an extra list level.
  filter_bank: [[[8, 13], [13, 20], [20, 30]]]
  estimator: ["lwf"]
  sfreq: [160]
  eps: [1.0e-6]
  covariance_signal_scale: ["auto"]
  replace_covariance_diagonal_with_raw_energy: [true]
  brain_region_mode: ["physionet_8x8"]
  covariance_output_dtype: ["float32"]
  channels: [null]

  imaged: [true]
  executed: [false]
  # Use [[unilateral_fist]] for two classes, or the setting below for four.
  task_types: [[unilateral_fist]]

  # Paired time fields follow train_grid.yaml's grid syntax.
  epoch_slice: [[-2.0, 4.0]]
  segment_slice: [[0.5, 0.25]]

  reject_threshold_uv: [null]
  use_ica: [false]
  ica_n_components: [20]
  ica_random_state: [42]
  ica_eog_channels: [""]
  use_autoreject: [false]
  autoreject_random_state: [42]
  autoreject_n_jobs: [1]
  autoreject_cv: [10]
  autoreject_cache_dir: "experiments/cache/autoreject_masks"
  autoreject_force_rebuild: false
  baseline_correction: [null]
  baseline_window: [null]

model:
  head_nums: [4]
  attention_dim: ["8"]
  # PhysioNet region covariances and this layer are both 8x8, so no stage
  # projection is needed. With false, attention_dim must equal the layer input.
  stage_transition: [false]
  stage_projection_init: ["random"]
  add_norm_type: ["sequence_add_norm"]
  # SPDFeedForward applies activation directly without hidden expansion.
  ffn_hidden_spd_dim: [null]
  # Low-rank feature mixing in the same tangent dimension; 0 disables it.
  ffn_tangent_mixer_rank: [4]
  tau: [1.3]
  metric: ["learnable-metric"]
  # Heads within one axis always share a metric; axes and Q/K/V stay distinct.
  # This controls sharing between encoder layers and has no effect at depth 1.
  share_metric_across_layers: [false]
  depth: [1]
  classifier_type: ["mdm"]
  pooling: ["weighted"]
  pooling_weight_mode: ["factorized"]
  pooling_dropout: [0.1]
  pooling_uniform_mix: [0.1]
  # The same gate is trained globally and retained during subject fine-tuning.
  pooling_mean_anchor: [true]
  dropout: [0.4]
  attention_dropout: [0.1]
  head_dropout: [0.1]
  use_position_bias: [true]
  position_bias_axes: ["time"]
  position_bias_max: [0.5]
  attention_score_target_rms: [1.0]
  attention_score_clip: [5.0]
  layer_norm_affine: [false]
  learnable_metric_mode: ["low-rank"]
  learnable_metric_score: ["distance"]
  learnable_metric_rank: [4]
  eps: [1.0e-6]

pretrain:
  # Split subjects once. Global-test subjects are completely absent from
  # Global training and validation. With 103 configured subjects, 0.2 holds
  # out approximately 21 subjects for cross-subject testing and adaptation.
  subject_train_size: [0.8]
  subject_test_size: [0.2]
  subject_split_seed: [42]
  subject_split_shuffle: [true]

  # Only trials from Global-train subjects are split into train/validation.
  # The validation partition selects the single best Global checkpoint.
  validation_size: [0.15]
  epochs: [100]
  batch_size: [128]
  precision: ["float32"]
  # Match the stable train_grid optimizer scale. The previous 0.006/0.0015
  # pair could overflow the learnable SPD attention metric before softmax.
  learning_rate: [0.004]
  stiefel_learning_rate: [0.0006]
  lr_scheduler: ["plateau"]
  lr_scheduler_metric: ["validation_macro_f1"]
  lr_scheduler_mode: ["max"]
  lr_scheduler_factor: [0.5]
  lr_scheduler_patience: [5]
  lr_scheduler_threshold: [0.0008]
  lr_scheduler_threshold_mode: ["abs"]
  lr_scheduler_min_lr: [1.0e-5]
  stiefel_lr_scheduler_min_lr: [1.0e-6]
  weight_decay: [0.01]
  apply_weight_decay_to_special_parameters: [true]
  gradient_clip_norm: [0.8]
  early_stopping_patience: [9]
  early_stopping_min_delta: [0.0008]
  condition_regularization_weight: [0.0]
  prototype_intra_weight: [0.001]
  prototype_inter_weight: [0.01]
  prototype_margin: [1.0]
  seed: [42]
  num_workers: [0]
  pin_memory: [true]
  allow_tf32: [false]

fine_tune:
  # Traverse every Global-test subject. For each one, restart from the same
  # Global checkpoint, pool all retained runs, and make one stratified split.
  # There is no fine-tune validation dataset.
  train_size: [0.7]
  test_size: [0.3]
  seed: [42]
  epochs: [150]
  batch_size: [64]
  precision: ["float32"]
  learning_rate: [0.0004]
  stiefel_learning_rate: [0.0001]
  lr_scheduler: ["none"]
  weight_decay: [0.01]
  apply_weight_decay_to_special_parameters: [true]
  gradient_clip_norm: [0.8]
  condition_regularization_weight: [0.0]
  prototype_intra_weight: [0.001]
  prototype_inter_weight: [0.01]
  prototype_margin: [1.0]
  num_workers: [0]
  pin_memory: [true]
  allow_tf32: [false]

output:
  dir: experiments/results/physionet_global_subject_split_finetune
  dataset_cache_dir: experiments/cache/preprocessed_datasets
  save_pretrained_checkpoints: true
  save_fine_tuned_checkpoints: false
