# train_grid.yaml-aligned singleton-grid configuration.
# data.subjects is the target subject set: use 1 or 1-10.
# data.pretrain_subjects is the complete candidate pretraining cohort; the
# current target is removed automatically before every target-specific run.

data:
  dataset: ["physionet_mi"]
  root_dir: ["data/MNE-eegbci-data/files/eegmmidb/1.0.0"]

  # Subjects to evaluate/fine-tune. This matches train_grid.yaml semantics.
  subjects: 1
  # Full cohort available for preprocessing and other-subject pretraining.
  # S088 is excluded because its sampling rate differs from the 160 Hz cohort.
  pretrain_subjects: 1-87,89-109

  # As in train_grid.yaml, one filter-bank candidate needs an extra list level.
  filter_bank: [[[8, 13], [13, 20], [20, 30]]]
  estimator: ["lwf"]
  sfreq: [160]
  eps: [1.0e-6]
  covariance_signal_scale: ["auto"]
  replace_covariance_diagonal_with_raw_energy: [true]
  brain_region_mode: ["physionet_8x8"]
  covariance_output_dtype: ["float32"]
  channels: [null]

  imaged: [true]
  executed: [false]
  # Nested because both task types belong to the same four-class experiment.
  task_types: [[unilateral_fist]]

  # Paired time fields follow train_grid.yaml's grid syntax.
  epoch_slice: [[0.0, 4.0]]
  segment_slice: [[0.5, 0.25]]

  reject_threshold_uv: [null]
  use_ica: [false]
  ica_n_components: [20]
  ica_random_state: [42]
  ica_eog_channels: [""]
  use_autoreject: [true]
  autoreject_random_state: [42]
  autoreject_n_jobs: [1]
  autoreject_cv: [10]
  autoreject_cache_dir: "experiments/cache/autoreject_masks"
  autoreject_force_rebuild: false
  baseline_correction: [null]
  baseline_window: [null]

model:
  head_nums: [4]
  attention_dim: ["8"]
  stage_transition: [true]
  stage_projection_init: ["random"]
  add_norm_type: ["sequence_add_norm"]
  ffn_hidden_spd_dim: [64]
  tau: [1.3]
  metric: ["learnable-metric"]
  depth: [1]
  classifier_type: ["mdm"]
  pooling: ["weighted"]
  dropout: [0.4]
  attention_dropout: [0.0]
  use_position_bias: [true]
  position_bias_axes: ["time"]
  position_bias_max: [0.5]
  attention_score_target_rms: [1.0]
  attention_score_clip: [5.0]
  layer_norm_affine: [false]
  learnable_metric_mode: ["low-rank"]
  learnable_metric_score: ["distance"]
  learnable_metric_rank: [4]
  eps: [1.0e-6]

pretrain:
  # Other-subject trials: 70% train, 15% validation, 15% test.
  validation_size: [0.15]
  test_size: [0.15]
  epochs: [100]
  batch_size: [128]
  precision: ["float32"]
  learning_rate: [0.0022]
  stiefel_learning_rate: [0.0003]
  lr_scheduler: ["plateau"]
  lr_scheduler_metric: ["validation_macro_f1"]
  lr_scheduler_mode: ["max"]
  lr_scheduler_factor: [0.5]
  lr_scheduler_patience: [8]
  lr_scheduler_threshold: [0.0008]
  lr_scheduler_threshold_mode: ["abs"]
  lr_scheduler_min_lr: [1.0e-5]
  stiefel_lr_scheduler_min_lr: [1.0e-6]
  weight_decay: [0.01]
  apply_weight_decay_to_special_parameters: [true]
  gradient_clip_norm: [0.8]
  early_stopping_patience: [11]
  early_stopping_min_delta: [0.0008]
  condition_regularization_weight: [0.0]
  seed: [42]
  num_workers: [0]
  pin_memory: [true]
  allow_tf32: [true]

fine_tune:
  # One selected target run is stratified approximately 50/50 into
  # validation/test; the other target runs are shuffled for fine-tuning.
  epochs: [25]
  batch_size: [32]
  precision: ["float32"]
  learning_rate: [0.0002]
  stiefel_learning_rate: [0.00005]
  lr_scheduler: ["plateau"]
  lr_scheduler_metric: ["validation_macro_f1"]
  lr_scheduler_mode: ["max"]
  lr_scheduler_factor: [0.5]
  lr_scheduler_patience: [5]
  lr_scheduler_threshold: [0.0008]
  lr_scheduler_threshold_mode: ["abs"]
  lr_scheduler_min_lr: [1.0e-5]
  stiefel_lr_scheduler_min_lr: [1.0e-6]
  weight_decay: [0.001]
  apply_weight_decay_to_special_parameters: [true]
  gradient_clip_norm: [0.8]
  early_stopping_patience: [8]
  early_stopping_min_delta: [0.0008]
  condition_regularization_weight: [0.0]
  num_workers: [0]
  pin_memory: [true]
  allow_tf32: [true]

output:
  dir: experiments/results/physionet_pretrain_finetune_loro
  dataset_cache_dir: experiments/cache/preprocessed_datasets
  save_pretrained_checkpoints: true
  save_fine_tuned_checkpoints: false
