data:
  dataset: ["bnci2014_001"]
  root_dir: ["data"]
  filter_bank:
    - [8, 30]
  estimator: ["cov"]
  sfreq: [250]
  eps: [1.0e-6]
  covariance_signal_scale: ["auto"]
  replace_covariance_diagonal_with_raw_energy: [false]
  subjects: 1-9
  events: "left_hand,right_hand,feet,tongue"
  sessions: "all"
  channels:
  reject_threshold_uv: [null]
  use_ica: [false]
  use_autoreject: [false]
  autoreject_random_state: [42]
  autoreject_n_jobs: [2]
  autoreject_cv: [10]
  baseline_correction: [null]
  baseline_window: "0,1"
  epoch_slice: [[0.0, 4.0]]
  segment_slice: [[0.25, 0.125]]
  moabb_accept_terms: [true]
  moabb_force_update: [false]
  test_size: [0.15]
  val_size: [0.15]
  allow_subject_overlap: [true]

training:
  seed: [42]
  precision: ["float32"]
  epochs: [50]
  batch_size: [64]
  spdnet_learning_rate: [0.001]
  spdnet_weight_decay: [0.0001]
  gradient_clip_norm: [1.0]
  split_file: experiments/splits/bnci2014_001_spdnet_seed42.json
  num_workers: [0]

output:
  dir: experiments/results/spdnet_baseline_bci_iv_2a
