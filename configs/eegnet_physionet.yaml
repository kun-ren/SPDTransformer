# EEGNet-8,2 under the same trial-level pretrain/fine-tune partition used by
# train_physionet_pretrain_finetune_loro.yaml. This is the fair protocol-aligned
# comparison; use eegnet_physionet_paper.yaml for the published paper protocol.

data:
  dataset: ["physionet_mi"]
  root_dir: ["data/MNE-eegbci-data/files/eegmmidb/1.0.0"]
  # EEGNet accepts one signal tensor rather than an SPD filter bank. A single
  # 8--30 Hz band covers the same frequency range as [8-13, 13-20, 20-30].
  filter_bank:
    - [8, 30]
  sfreq: [160]
  # Target subjects. Use 1 for one target or 1-10 for a batch.
  subjects: 1-87,90-91,93-99,101-103,105,107-109
  # Complete candidate cohort. Transfer training removes the current target
  # before any pretraining split is made.
  pretrain_subjects: 1-87,90-91,93-99,101-103,105,107-109
  channels: null
  reject_threshold_uv: [null]
  use_ica: [false]
  ica_n_components: [20]
  ica_random_state: [42]
  ica_eog_channels: [""]
  use_autoreject: [false]
  autoreject_random_state: [42]
  autoreject_n_jobs: [1]
  autoreject_cv: [10]
  baseline_correction: [null]
  baseline_window: [null]
  imaged: [true]
  executed: [false]
  task_types: [[unilateral_fist]]
  # Match the SPDTransformer epoch. EEGNet must retain it as one full trial;
  # 0.5 s overlapping segments are SPD tokens and are not EEGNet inputs.
  epoch_slice: [[-2.0, 4.0]]
  segment_slice: [[6.0, null]]
  # Convert PhysioNet volts to microvolts, then estimate channel mean/std only
  # from the current training partition (never validation/test data).
  eegnet_input_scale: [1.0e6]
  eegnet_standardize: [true]

model:
  # Official default model is EEGNet-8,2: F1=8, D=2, F2=F1*D=16.
  F1: 8
  D: 2
  F2: 16
  # The paper used length 32 at 128 Hz for SMR. PhysioNet is 160 Hz, so 40
  # samples preserves the official 0.25 s temporal receptive field.
  kernel_length: 40
  separable_kernel_length: 16
  within_subject_dropout: 0.5
  cross_subject_dropout: 0.25
  depthwise_max_norm: 1.0
  classifier_max_norm: 0.25

training:
  seed: [42]
  protocol: [transfer]

  # subject_wise_n_splits=1 exactly follows the current SPDTransformer target
  # protocol: pool runs, stratified trial shuffle, 70% train / 30% test.
  # Set this to 4 for optional within-subject four-fold cross-validation.
  subject_wise_n_splits: [1]
  train_size: [0.7]
  test_size: [0.3]

  # Fixed official-style training: Adam, categorical cross-entropy, batch 16,
  # up to 500 epochs. There is no validation selection or early stopping here.
  epochs: [500]
  batch_size: [16]
  learning_rate: [0.001]

  # For every target subject, pool trials from every retained run. Other-subject
  # trials are split 70/15/15; target trials are split 70/30 with no validation.
  # No run is reserved as an independent test set in either stage.
  pretrain_train_size: [0.7]
  pretrain_validation_size: [0.15]
  pretrain_test_size: [0.15]
  pretrain_epochs: [500]
  pretrain_learning_rate: [0.001]
  fine_tune_epochs: [100]
  fine_tune_learning_rate: [0.0001]
  # Fine-tune every layer by default; set true for classifier-only adaptation.
  freeze_feature_extractor: [false]
  num_workers: [0]
  pin_memory: [true]
  log_every: [10]

output:
  dir: experiments/results/eegnet_physionet_pretrain_finetune_trial_split
