data:
  dataset: ["physionet_mi"]
  root_dir: ["data/MNE-eegbci-data/files/eegmmidb/1.0.0"]
  filter_bank:
    - [[8, 13], [13, 20], [20, 30]]
  estimator: ["lwf"]
  sfreq: [160]
  eps: [1.0e-6]
  covariance_signal_scale: ["auto"]
  replace_covariance_diagonal_with_raw_energy: [false]
  brain_region_mode: ["physionet_8x8"]
  subjects: 1-87,89-109
  channels:
    - null
  reject_threshold_uv: [null]
  use_ica: [false]
  ica_n_components: [13]
  ica_random_state: [42]
  ica_eog_channels: ["FP1,FP2"]
  use_autoreject: [true]
  autoreject_random_state: [42]
  autoreject_n_jobs: [16]
  autoreject_cv: [10]
  baseline_correction: [null]
  baseline_window: "-3,0"
  epoch_slice: [[0.0, 4.0]]
  segment_slice: [[4.0, 0.5]]
  imaged: true
  executed: false
  task_types: unilateral_fist
  test_size: [0.2]
  allow_subject_overlap: [true]

model:
  # Add "differentiable" to compare trainable Log-Euclidean prototypes.
  classifier_type: ["differentiable"]
  pooling: ["weighted"]
  token_weight_logits: null
#  metric_mean: ["riemann", "logeuclid"]
#  metric_distance: ["riemann", "logeuclid"]

training:
  seed: [42]
  split_file: null
  # Used only by classifier_type="differentiable".
  epochs: [150]
  batch_size: [128]
  learning_rate: [0.012]  # best 0.012
  weight_decay: [0.08] # best 0.08
  gradient_clip_norm: [0.025]   # best 0.025
  precision: ["float32"]
  num_workers: [0]
  pin_memory: [true]

output:
  dir: experiments/results/mdm_grid_physionet
  dataset_cache_dir: experiments/cache/mdm_preprocessed_datasets
