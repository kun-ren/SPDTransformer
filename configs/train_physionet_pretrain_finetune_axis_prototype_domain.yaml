# Based on main (202d37c). Preprocessing and split settings match that baseline.
# train_grid.yaml-aligned singleton-grid configuration.
# data.subjects is the target subject set: use 1 or 1-10.
# data.pretrain_subjects is the complete candidate pretraining cohort; the
# current target is removed automatically before every target-specific run.

data:
  dataset: ["physionet_mi"]
  root_dir: ["data/MNE-eegbci-data/files/eegmmidb/1.0.0"]

  # Subjects to evaluate/fine-tune. This matches train_grid.yaml semantics.
  subjects: 1-87,90-91,93-99,101-103,105,107-109
  # Full cohort available for preprocessing and other-subject pretraining.
  # Exclude S088, S089, S092, S100, S104, and S106.
  pretrain_subjects: 1-87,90-91,93-99,101-103,105,107-109

  # As in train_grid.yaml, one filter-bank candidate needs an extra list level.
  filter_bank: [[[8, 13], [13, 20], [20, 30]]]
  estimator: ["lwf"]
  sfreq: [160]
  eps: [1.0e-6]
  covariance_signal_scale: ["auto"]
  replace_covariance_diagonal_with_raw_energy: [true]
  brain_region_mode: ["physionet_8x8"]
  covariance_output_dtype: ["float32"]
  channels: [null]

  imaged: [true]
  executed: [false]
  # Use [[unilateral_fist]] for two classes, or the setting below for four.
  task_types: [[unilateral_fist]]

  # Paired time fields follow train_grid.yaml's grid syntax.
  epoch_slice: [[-2.0, 4.0]]
  segment_slice: [[0.5, 0.25]]

  reject_threshold_uv: [null]
  use_ica: [false]
  ica_n_components: [20]
  ica_random_state: [42]
  ica_eog_channels: [""]
  use_autoreject: [false]
  autoreject_random_state: [42]
  autoreject_n_jobs: [1]
  autoreject_cv: [10]
  autoreject_cache_dir: "experiments/cache/autoreject_masks"
  autoreject_force_rebuild: false
  baseline_correction: [null]
  baseline_window: [null]

model:
  # Independent axis metrics; Q/K/V projections always remain independent.
  # true shares same-axis metrics across layers with matching dimensions.
  share_metric_across_layers: [false]
  domain_adversarial: [true]
  domain_hidden_dim: [32]
  domain_dropout: [0.3]
  head_nums: [4]
  attention_dim: ["8"]
  stage_transition: [true]
  stage_projection_init: ["random"]
  add_norm_type: ["sequence_add_norm"]
  ffn_hidden_spd_dim: [64]
  tau: [1.3]
  metric: ["learnable-metric"]
  depth: [1]
  classifier_type: ["mdm"]
  pooling: ["mean"]
  dropout: [0.4]
  attention_dropout: [0.0]
  use_position_bias: [true]
  position_bias_axes: ["time"]
  position_bias_max: [0.5]
  attention_score_target_rms: [1.0]
  attention_score_clip: [5.0]
  layer_norm_affine: [false]
  learnable_metric_mode: ["low-rank"]
  learnable_metric_score: ["distance"]
  learnable_metric_rank: [3]
  eps: [1.0e-6]

pretrain:
  # CE + lambda1 * class-conditional distance + lambda2 * prototype margin.
  # Both zero disables prototype regularization.
  prototype_intra_weight: [0.001]
  prototype_inter_weight: [0.01]
  prototype_margin: [1.0]
  # GRL ramps up after warmup; subject classification trains during warmup.
  domain_adversarial_max_weight: [0.03]
  domain_adversarial_warmup_epochs: [10]
  domain_adversarial_schedule: ["dann"]
  domain_loss_normalize: [true]
  # Other-subject trials: 70% train, 15% validation, 15% test.
  validation_size: [0.15]
  test_size: [0.15]
  epochs: [100]
  batch_size: [128]
  precision: ["float32"]
  learning_rate: [0.004]
  stiefel_learning_rate: [0.0006]
  lr_scheduler: ["multistep"]
  # Nested list is one schedule. Early stopping remains independent.
  lr_scheduler_milestones: [[40, 70]]
  lr_scheduler_gamma: [0.5]
  weight_decay: [0.001]
  apply_weight_decay_to_special_parameters: [true]
  gradient_clip_norm: [1.0]
  early_stopping_patience: [10]
  early_stopping_min_delta: [0.0008]
  condition_regularization_weight: [0.0]
  seed: [42]
  num_workers: [0]
  pin_memory: [true]
  allow_tf32: [false]

fine_tune:
  # CE + lambda1 * class-conditional distance + lambda2 * prototype margin.
  # Both zero disables prototype regularization.
  prototype_intra_weight: [0.001]
  prototype_inter_weight: [0.01]
  prototype_margin: [1.0]
  # Single-target fine-tuning freezes and skips the source-domain head.
  # One selected target run is stratified approximately 50/50 into
  # validation/test; the other target runs are shuffled for fine-tuning.
  epochs: [50]
  batch_size: [64]
  precision: ["float32"]
  learning_rate: [0.0004]
  stiefel_learning_rate: [0.0001]
  lr_scheduler: ["multistep"]
  lr_scheduler_milestones: [[20, 35]]
  lr_scheduler_gamma: [0.5]
  weight_decay: [0.1]
  apply_weight_decay_to_special_parameters: [true]
  gradient_clip_norm: [1.5]
  early_stopping_patience: [9]
  early_stopping_min_delta: [0.0008]
  condition_regularization_weight: [0.0]
  num_workers: [0]
  pin_memory: [true]
  allow_tf32: [false]

output:
  dir: experiments/results/physionet_pretrain_finetune_axis_prototype_domain
  dataset_cache_dir: experiments/cache/preprocessed_datasets
  save_pretrained_checkpoints: true
  save_fine_tuned_checkpoints: false
