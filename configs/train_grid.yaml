data:
  root_dir: ["data/MNE-eegbci-data/files/eegmmidb/1.0.0"]
  filter_bank:
    - [8, 13]
    - [13, 20]
    - [20, 30]
  estimator: ["lwf"]
  sfreq: [160]
  eps: [1.0e-6]
  subjects: 1-87,89-109
  channels: "FC5, FC3, FC1, FCz, FC2, FC4, FC6, C5, C3, C1, Cz, C2, C4, C6, CP5, CP3, CP1, CPz, CP2, CP4, CP6"
  reject_threshold_uv: [null]  # set e.g. 500 to enable peak-to-peak epoch rejection
  use_ica: [false]
  ica_n_components: [15]
  ica_random_state: [42]
  ica_eog_channels: ["FP1,FP2"]
  use_autoreject: [true]
  autoreject_random_state: [42]
  autoreject_n_jobs: [2]
  autoreject_cv: [10]
  baseline_correction: [null]
  baseline_window: "-3,0"
  epoch_tmin: [-1.0]
  epoch_tmax: [4.0]
  segment_duration: [1.0]
  stride_duration: [0.5]
  imaged: True
  executed: False
  task_types: unilateral_fist

model:
  spd_out_dim: [21]
  ffn_hidden_spd_dim: [462, 924]
  tau: [1.3]
  metric: ["learnable-metric"]
  depth: [1]
  classifier_type: ["pooling"]
  pooling: ["mean"]
  dropout: [0.2]
  attention_dropout: [0.0]   #   fix to 0.0 or 0.1
  use_position_bias: [false] # slightly better than true in low-rank
  layer_norm_affine: [true] # true
  debug_attention_dropout: [false]
  debug_attention_shape: [false]
  debug_tensor_stats: [False]
  learnable_metric_mode: ["low-rank"]
  learnable_metric_rank: [null]
  metric_eps: [1.0e-6]

training:
  seed: [42]
  precision: ["float64"]
  epochs: [16]
  batch_size: [128]
  learning_rate: [0.002] # best 0.002
  weight_decay: [0.001, 0.005, 0.01]    # 0.001 is worse than 0.005 and 0.05
  apply_weight_decay_to_special_parameters: [true, false]  # no big difference to be determined
  gradient_clip_norm: [0.8]  # best 0.8
  test_size: [0.15]
  val_size: [0.15]
  allow_subject_overlap: [true]  # false = subject-level split for cross-subject generalization
  split_file: ["experiments/splits/physionet_mi_seed42_subject_split.json"]
  num_workers: [0]

output:
  dir: experiments/results/spd_transformer_grid
  dataset_cache_dir: experiments/cache/preprocessed_datasets
