data:
  root_dir: ["data/MNE-eegbci-data/files/eegmmidb/1.0.0"]
  filter_bank:
    - [8, 13]
    - [13, 20]
    - [20, 30]
  estimator: ["lwf"]
  sfreq: [160]
  eps: [1.0e-6]
  subjects: 1-87,89-109
  channels: "FC5, FC3, FC1, FCz, FC2, FC4, FC6, C5, C3, C1, Cz, C2, C4, C6, CP5, CP3, CP1, CPz, CP2, CP4, CP6"
  reject_threshold_uv: [null]
  baseline_correction: [null]
  baseline_window: "-2,0"
  epoch_tmin: [-1.0]
  epoch_tmax: [4.0]
  segment_duration: [1.0]
  stride_duration: [0.5]
  imaged: True
  executed: False
  task_types: unilateral_fist

model:
  spd_out_dim: [21]
  ffn_hidden_spd_dim: [42]
  tau: [1.0]
  metric: ["learnable-metric"]
  depth: [2,4]
  classifier_type: ["pooling"]
  pooling: ["mean", "attention"]
  dropout: [0.1, 0.2]
  attention_dropout: [0.0,0.1, 0.2]
  use_position_bias: [true]
  layer_norm_affine: [true]
  debug_attention_dropout: [false]
  debug_attention_shape: [false]
  debug_tensor_stats: [False]
  learnable_metric_mode: ["low-rank","kronecker"]
  learnable_metric_rank: [null]
  metric_eps: [1.0e-6]

training:
  seed: [42]
  precision: ["float64"]
  epochs: [30]
  batch_size: [128]
  learning_rate: [0.003, 0.002]
  weight_decay: [1.0e-3]
  apply_weight_decay_to_special_parameters: [false, true]
  gradient_clip_norm: [0.8, 1.2]
  test_size: [0.15]
  val_size: [0.15]
  split_file: ["experiments/splits/physionet_mi_seed42.json"]
  num_workers: [0]

output:
  dir: experiments/results/spd_transformer_grid
  dataset_cache_dir: experiments/cache/preprocessed_datasets
