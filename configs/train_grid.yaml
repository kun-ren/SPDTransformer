data:
  root_dir: ["data/MNE-eegbci-data/files/eegmmidb/1.0.0"]
  filter_bank:
    - [8, 13]
    - [13, 20]
    - [20, 30]
  estimator: ["cov"]
  sfreq: [160]
  eps: [1.0e-6]
  covariance_signal_scale: [1.0e6]
  replace_covariance_diagonal_with_raw_energy: [false]
  subjects: 1-87,89-109
  #channels: "FC5, FC3, FC1, FCz, FC2, FC4, FC6, C5, C3, C1, Cz, C2, C4, C6, CP5, CP3, CP1, CPz, CP2, CP4, CP6"
  channels:
  reject_threshold_uv: [null]  # set e.g. 500 to enable peak-to-peak epoch rejection
  use_ica: [false]
  ica_n_components: [13]
  ica_random_state: [42]
  ica_eog_channels: ["FP1,FP2"]
  use_autoreject: [true]
  autoreject_random_state: [42]
  autoreject_n_jobs: [2]
  autoreject_cv: [10]
  baseline_correction: [null]
  baseline_window: "-3,0"
  epoch_tmin: [0.0]
  epoch_tmax: [4.0]
  segment_duration: [1.0]
  stride_duration: [0.5]
  imaged: True
  executed: False
  task_types: unilateral_fist
  seed: [42]
  test_size: [0.2]
  allow_subject_overlap: [true]

model:
  #   16, 64 is also high
  head_nums: [1, 2] # 4 is better than 1
  attention_dim: ["64, 32", "64, 64"]
  stage_transition: [True]
  stage_projection_init: ["random"] # "random" is much better than indentity
  add_norm_type: ["sequence_add_norm"]
  ffn_hidden_spd_dim: [null]
  tau: [1.3]
  metric: ["learnable-metric"]
  depth: [2]
  classifier_type: ["mdm"]
  pooling: ["mean", "weighted"]
  dropout: [0.2]
  attention_dropout: [0.0]   #   fix to 0.0 or 0.1
  use_position_bias: [true] # slightly better than true in low-rank
  layer_norm_affine: [false] # true
  debug_attention_dropout: [false]
  debug_attention_shape: [false]
  debug_tensor_stats: [False]
  learnable_metric_mode: ["low-rank"]
  learnable_metric_rank: [16]
  eps: [1.0e-6]

training:
  precision: ["float32"]
  epochs: [50]
  batch_size: [64]
  learning_rate: [0.002] #  0.002 is better than 0.0015
  stiefel_learning_rate: [0.0005]
  lr_scheduler: ["plateau"]
  lr_scheduler_metric: ["test_macro_f1"]
  lr_scheduler_factor: [0.5]
  lr_scheduler_patience: [5]
  lr_scheduler_threshold: [0.0005]
  lr_scheduler_threshold_mode: ["abs"]
  lr_scheduler_min_lr: [1.0e-5]
  stiefel_lr_scheduler_min_lr: [1.0e-6]
  weight_decay: [0.001]    # 0.001 is worse than 0.005 and 0.05
  apply_weight_decay_to_special_parameters: [true]  # no big difference to be determined
  gradient_clip_norm: [0.8]  # best 0.8
  early_stopping_patience: [ 12 ]
  early_stopping_min_delta: [ 0.0005 ]
  condition_regularization_weight: [0.0]
  num_workers: [0]

output:
  dir: experiments/results/spd_transformer_grid
  dataset_cache_dir: experiments/cache/preprocessed_datasets
