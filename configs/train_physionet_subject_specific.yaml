# Strict subject-specific / subject-dependent PhysioNet-MI benchmark.
# One model is trained independently for each subject and outer CV fold.
data:
  dataset: physionet_mi
  root_dir: data/MNE-eegbci-data/files/eegmmidb/1.0.0
  # Keep the same broad cohort as the current thesis experiments. S088 is
  # omitted because it was recorded at 128 Hz rather than 160 Hz.
  subjects: 1-87,89-109
  filter_bank:
    - [8, 13]
    - [13, 20]
    - [20, 30]
  estimator: lwf
  sfreq: 160
  eps: 1.0e-6
  covariance_signal_scale: auto
  replace_covariance_diagonal_with_raw_energy: true
  brain_region_mode: physionet_8x8
  channels: null

  # Four pure motor-imagery classes: left hand, right hand, both hands, feet.
  imaged: true
  executed: false
  task_types: [unilateral_fist, both]
  expected_num_classes: 4
  min_trials_per_class: 10
  # Some public records have incomplete trials. Keep an audit trail and train
  # only subjects that can support all outer folds.
  on_incomplete_subject: skip

  # Use the complete post-cue MI interval. The 0.5 s windows remain together
  # as one trial-level sequence and are never split across train/test.
  epoch_slice: [0.0, 4.0]
  segment_slice: [0.5, 0.25]
  reject_threshold_uv: null
  use_ica: false
  use_autoreject: false
  baseline_correction: null

model:
  head_nums: 4
  attention_dim: "8"
  stage_transition: true
  stage_projection_init: random
  add_norm_type: sequence_add_norm
  ffn_hidden_spd_dim: 64
  tau: 1.3
  metric: learnable-metric
  depth: 1
  classifier_type: mdm
  pooling: weighted
  dropout: 0.4
  attention_dropout: 0.0
  use_position_bias: true
  position_bias_axes: time
  position_bias_max: 0.5
  attention_score_target_rms: 1.0
  attention_score_clip: 5.0
  layer_norm_affine: false
  learnable_metric_mode: low-rank
  learnable_metric_score: distance
  learnable_metric_rank: 4
  eps: 1.0e-6

training:
  # Five outer folds produce one out-of-sample prediction for every trial.
  outer_splits: 5
  # Drawn only from each outer training fold; controls early stopping.
  validation_size: 0.2
  seed: 42
  precision: float32
  epochs: 100
  batch_size: 32
  learning_rate: 0.0022
  stiefel_learning_rate: 0.0003
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 8
  lr_scheduler_threshold: 0.0008
  lr_scheduler_min_lr: 1.0e-5
  stiefel_lr_scheduler_min_lr: 1.0e-6
  weight_decay: 0.01
  gradient_clip_norm: 0.8
  early_stopping_patience: 12
  early_stopping_min_delta: 0.0008
  condition_regularization_weight: 0.0
  num_workers: 0
  pin_memory: true
  # Hundreds of subject/fold models are trained; enable only if checkpoints
  # are needed for later inference.
  save_checkpoints: false

output:
  dir: experiments/results/physionet_subject_specific
  dataset_cache_dir: experiments/cache/preprocessed_datasets
