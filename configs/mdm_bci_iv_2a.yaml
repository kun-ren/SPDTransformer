data:
  dataset: ["bnci2014_001"]
  root_dir: ["data"]
  # Classical MDM uses one full-trial covariance matrix per trial.
  filter_bank:
    - [8, 30]
  estimator: ["lwf"]
  sfreq: [250]
  eps: [1.0e-6]
  covariance_signal_scale: ["auto"]
  replace_covariance_diagonal_with_raw_energy: [false]
  brain_region_mode: [null]

  subjects: 1-9
  events: "left_hand,right_hand,feet,tongue"
  sessions: "all"
  channels: null
  reject_threshold_uv: [null]
  use_ica: [false]
  use_autoreject: [false]
  baseline_correction: [null]
  baseline_window: "0,1"
  epoch_slice: [[0.0, 4.0]]
  segment_slice: [[4.0, 4.0]]
  moabb_accept_terms: [true]
  moabb_force_update: [false]

  test_size: [0.2]
  val_size: [0.0]
  allow_subject_overlap: [true, false]

model:
  classifier_type: ["pyriemann"]
  pooling: ["original"]
  token_weight_logits: null
  metric_mean: ["riemann"]
  metric_distance: ["riemann"]
  n_jobs: [1]

training:
  seed: [42]
  n_splits: [5]
  split_file: null
  # These values apply only if classifier_type is changed to differentiable.
  epochs: [100]
  batch_size: [64]
  learning_rate: [0.01]
  weight_decay: [0.0]
  gradient_clip_norm: [1.0]
  precision: ["float32"]
  num_workers: [0]
  pin_memory: [true]

output:
  dir: experiments/results/mdm_baseline_bci_iv_2a
  dataset_cache_dir: experiments/cache/mdm_preprocessed_datasets
