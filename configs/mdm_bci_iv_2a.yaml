data:
  dataset: ["bnci2014_001"]
  root_dir: ["data"]
  filter_bank:
    - [8, 30]
  estimator: ["cov"]
  sfreq: [250]
  eps: [1.0e-6]
  covariance_signal_scale: ["auto"]
  replace_covariance_diagonal_with_raw_energy: [false]
  subjects: 1-9
  events: "left_hand,right_hand,feet,tongue"
  sessions: "all"
  channels:
  reject_threshold_uv: [null]
  use_ica: [false]
  use_autoreject: [false]
  autoreject_random_state: [42]
  autoreject_n_jobs: [2]
  autoreject_cv: [10]
  baseline_correction: [null]
  baseline_window: "0,1"
  epoch_tmin: [0.0]
  epoch_tmax: [4.0]
  segment_duration: [4.0]
  stride_duration: [4.0]
  moabb_accept_terms: [true]
  moabb_force_update: [false]

model:
  pooling: ["original"]
  token_weight_logits: null

training:
  seed: [42]
  test_size: [0.2]
  allow_subject_overlap: [true]
  split_file: experiments/splits/bnci2014_001_mdm_test20_seed42.json

output:
  dir: experiments/results/mdm_baseline_bci_iv_2a
