data:
  root_dir: ["data/MNE-eegbci-data/files/eegmmidb/1.0.0"]
  filter_bank:
    - [8, 13]
    - [13, 20]
    - [20, 30]
  estimator: ["lwf"]
  sfreq: [160]
  eps: [1.0e-6]
  covariance_signal_scale: [1.0e6]
  subjects: 1-87,89-109
  channels: "FC5, FC3, FC1, FCz, FC2, FC4, FC6, C5, C3, C1, Cz, C2, C4, C6, CP5, CP3, CP1, CPz, CP2, CP4, CP6"
  reject_threshold_uv: [500]
  use_ica: [false]
  ica_n_components: [13]
  ica_random_state: [42]
  ica_eog_channels: ["FP1,FP2"]
  use_autoreject: [true]
  autoreject_random_state: [42]
  autoreject_n_jobs: [2]
  autoreject_cv: [10]
  baseline_correction: [null]
  baseline_window: "-3,0"
  epoch_tmin: [0.0]
  epoch_tmax: [3.0, 4.0]
  segment_duration: [1.0]
  stride_duration: [0.5]
  imaged: True
  executed: False
  task_types: unilateral_fist
  seed: [42]
  test_size: [0.2]
  allow_subject_overlap: [true]

model:
  attention_dim: [12]
  stage_transition: [true]
  freeze_first_stage_projection: [true]
  ffn_hidden_spd_dim: [84]
  tau: [1.3]
  metric: ["learnable-metric"]
  depth: [3,4 ]
  classifier_type: ["pooling"]
  pooling: ["mean", "weighted"]
  dropout: [0.2, 0.1]
  attention_dropout: [0]
  use_position_bias: [true]
  layer_norm_affine: [true]
  debug_attention_dropout: [false]
  debug_attention_shape: [false]
  debug_tensor_stats: [false]
  learnable_metric_mode: ["low-rank"]
  learnable_metric_rank: [16]
  eps: [1.0e-6]

training:
  precision: ["float64"]
  epochs: [60]
  batch_size: [64]
  learning_rate: [0.001, 0.0015]
  stiefel_learning_rate: [0.0005]
  weight_decay: [0.003]
  apply_weight_decay_to_special_parameters: [true]
  gradient_clip_norm: [1.0]
  condition_regularization_weight: [0.0]
  early_stopping_patience: [12]
  early_stopping_min_delta: [0.0005]
  num_workers: [0]
  debug_anomaly: [false]

output:
  dir: experiments/results/spd_transformer_overnight
  dataset_cache_dir: experiments/cache/preprocessed_datasets
