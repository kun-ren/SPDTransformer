data:
  dataset: ["physionet_mi"]
  root_dir: ["data/MNE-eegbci-data/files/eegmmidb/1.0.0"]
  filter_bank:
    - [8, 30]
  sfreq: [160]
  # S088, S092, S100, and S104 have incomplete/anomalous recordings.
  subjects: 1-87,89-109
  # null keeps all 64 EEG channels from EEGMMIDB.
  channels: null
  reject_threshold_uv: [null]
  use_ica: [false]
  ica_n_components: [13]
  ica_random_state: [42]
  ica_eog_channels: ["FP1,FP2"]
  use_autoreject: [true]
  autoreject_random_state: [42]
  autoreject_n_jobs: [2]
  autoreject_cv: [10]
  baseline_correction: [null]
  baseline_window: "-3,0"
  # Full post-cue motor-imagery interval used by standard CSP pipelines.
  epoch_slice: [[0.0, 4.0]]
  segment_slice: [[4.0, null]]
  imaged: true
  executed: false
  task_types: unilateral_fist
  test_size: [0.2]
  val_size: [0.0]
  allow_subject_overlap: [true,false]

training:
  seed: [42]
  n_splits: [5]

model:
  n_components: 6
  mne_log_level: WARNING

output:
  dir: experiments/results/csp_lda_baseline_physionet
