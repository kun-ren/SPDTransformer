data:
  dataset: ["physionet_mi"]
  root_dir: ["data/MNE-eegbci-data/files/eegmmidb/1.0.0"]
  filter_bank:
    - [8, 30]
  sfreq: [160]
  # Subjects evaluated independently. Set to 1 for one target or 1-10 for a
  # batch. S088 is omitted because it uses a different sampling rate.
  subjects: 1-87,89-109
  # null keeps all 64 EEG channels from EEGMMIDB.
  channels: null
  reject_threshold_uv: [null]
  use_ica: [false]
  ica_n_components: [13]
  ica_random_state: [42]
  ica_eog_channels: ["FP1,FP2"]
  use_autoreject: [true]
  autoreject_random_state: [42]
  autoreject_n_jobs: [8]
  autoreject_cv: [10]
  baseline_correction: [null]
  baseline_window: "-3,0"
  # Ignore the cue transient and classify the established 0.5--4.0 s MI window.
  epoch_slice: [[0.5, 4.0]]
  segment_slice: [[3.5, null]]
  imaged: true
  executed: false
  task_types: unilateral_fist
  # Subject-specific mode below enforces one subject in every run split; this
  # legacy option is retained as a singleton for grid compatibility.
  allow_subject_overlap: [true]

training:
  seed: [42]
  # Each run is held out once and split approximately 50/50 into
  # validation/test. All other runs from the same subject are training data.
  held_out_run_validation_size: [0.5]
  # Fit a separate CSP+LDA model inside each subject. No trial from another
  # subject can enter that subject's train, validation, or test split.
  subject_specific: [true]

model:
  # Six filters is the established PhysioNet CSP setting. Ledoit-Wolf
  # regularization is applied both to CSP covariance estimation and LDA,
  # which is more stable for the small number of trials in each subject/run.
  n_components: 6
  csp_reg: ledoit_wolf
  csp_log: true
  csp_norm_trace: false
  lda_solver: lsqr
  lda_shrinkage: auto
  mne_log_level: WARNING

output:
  dir: experiments/results/csp_lda_subject_specific_physionet
