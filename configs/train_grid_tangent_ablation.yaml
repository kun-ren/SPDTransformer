data:
  # Kept identical to configs/train_grid.yaml for a one-variable ablation.
  dataset: ["physionet_mi"]
  root_dir: ["data/MNE-eegbci-data/files/eegmmidb/1.0.0"]
  filter_bank:
    - [8, 13]
    - [13, 20]
    - [20, 30]
  estimator: ["cov"]
  sfreq: [160]
  eps: [1.0e-6]
  covariance_signal_scale: ["auto"]
  replace_covariance_diagonal_with_raw_energy: [true]
  brain_region_mode: ["physionet_8x8"]
  subjects: 1-87,89-109
  channels:
  reject_threshold_uv: [null]
  use_ica: [false]
  ica_n_components: [13]
  ica_random_state: [42]
  ica_eog_channels: ["FP1,FP2"]
  use_autoreject: [true]
  autoreject_random_state: [42]
  autoreject_n_jobs: [8]
  autoreject_cv: [10]
  baseline_correction: [null]
  baseline_window: "-3,0"
  epoch_tmin: [-1.0]
  epoch_tmax: [4.0]
  segment_duration: [1.0]
  stride_duration: [0.5]
  imaged: true
  executed: false
  task_types: unilateral_fist
  seed: [42]
  test_size: [0.2]
  allow_subject_overlap: [true]

model:
  # This is the ablation switch. All data, classifier, and training settings
  # below mirror train_grid.yaml. For an 8x8 SPD token, tangent_d_model
  # defaults to 8*(8+1)/2 = 36, so matrix<->vector is lossless and no feature
  # bottleneck projection is inserted.
  encoder_type: ["tangent"]
  head_nums: [1]
  attention_dim: [8]
  stage_transition: [true]
  stage_projection_init: ["random"]
  add_norm_type: ["sequence_add_norm"]
  ffn_hidden_spd_dim: [64]
  tau: [1.3]
  metric: ["learnable-metric"]
  depth: [1]
  classifier_type: ["mdm"]
  pooling: ["weighted"]
  dropout: [0.2]
  attention_dropout: [0]
  use_position_bias: [false]
  position_bias_axes: ["time"]
  position_bias_max: [0.5]
  attention_score_target_rms: [1.0]
  attention_score_clip: [5.0]
  layer_norm_affine: [false]
  learnable_metric_mode: ["low-rank"]
  learnable_metric_rank: [4]
  eps: [1.0e-6]

  # Native Transformer-only settings. Defaults shown explicitly for audit.
  tangent_d_model: [36]
  tangent_nhead: [1]
  tangent_num_layers: [1]
  tangent_dim_feedforward: [64]
  tangent_activation: ["gelu"]
  tangent_norm_first: [false]
  tangent_use_position_embedding: [false]

training:
  precision: ["float32"]
  epochs: [150]
  batch_size: [128]
  learning_rate: [0.0022]
  # There is no Stiefel parameter in the Euclidean encoder. train.py keeps
  # this value in the comparable config but does not create an empty optimizer.
  stiefel_learning_rate: [0.0003]
  lr_scheduler: ["plateau"]
  lr_scheduler_metric: ["test_macro_f1"]
  lr_scheduler_factor: [0.5]
  lr_scheduler_patience: [10]
  lr_scheduler_threshold: [0.0008]
  lr_scheduler_threshold_mode: ["abs"]
  lr_scheduler_min_lr: [1.0e-5]
  stiefel_lr_scheduler_min_lr: [1.0e-6]
  weight_decay: [0.01]
  apply_weight_decay_to_special_parameters: [true]
  gradient_clip_norm: [0.8]
  early_stopping_patience: [10]
  early_stopping_min_delta: [0.0008]
  condition_regularization_weight: [0.0]
  num_workers: [0]
  pin_memory: [true]
  allow_tf32: [true]

output:
  dir: experiments/results/tangent_transformer_ablation
  dataset_cache_dir: experiments/cache/preprocessed_datasets
