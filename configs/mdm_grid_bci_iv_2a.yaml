data:
  dataset: ["bnci2014_001"]
  root_dir: ["data"]
  filter_bank:
    - [[8, 30]]
    - [[8, 13], [13, 20], [20, 30]]
  estimator: ["lwf"]
  sfreq: [250]
  eps: [1.0e-6]
  covariance_signal_scale: ["auto"]
  replace_covariance_diagonal_with_raw_energy: [false]
  subjects: 1-9
  events: "left_hand,right_hand,feet,tongue"
  sessions: "all"
  channels: [null]
  reject_threshold_uv: [null]
  use_ica: [false]
  ica_n_components: [13]
  ica_random_state: [42]
  ica_eog_channels: ["FP1,FP2"]
  use_autoreject: [true]
  autoreject_random_state: [42]
  autoreject_n_jobs: [8]
  autoreject_cv: [10]
  baseline_correction: [null]
  baseline_window: "-3,0"
  epoch_tmin: [0.0]
  epoch_tmax: [4.0]
  segment_duration: [4.0, 1.0]
  stride_duration: [0.5]
  moabb_accept_terms: [true]
  moabb_force_update: [false]

model:
  pooling: ["original", "mean", "weighted"]
  token_weight_logits: null
  metric_mean: ["riemann", "logeuclid"]
  metric_distance: ["riemann", "logeuclid"]

training:
  seed: [42]
  test_size: [0.2]
  allow_subject_overlap: [true]
  split_file: null

output:
  dir: experiments/results/mdm_grid_bci_iv_2a
