# Dedicated hyperparameter selection for the Global cross-subject model.
# Each hyperparameter configuration runs subject-wise 5-fold CV. A fold uses
# only train and test subjects: no validation, early stopping, final holdout,
# checkpoint reuse, or subject-specific fine-tuning.
#
# Selection score: arithmetic mean of the five fold test accuracies.
# Important: because test-fold accuracy selects hyperparameters, it is a CV
# model-selection score, not an unbiased final test estimate.

data:
  dataset: ["physionet_mi"]
  root_dir: ["data/MNE-eegbci-data/files/eegmmidb/1.0.0"]
  subjects: 1-87,90-91,93-99,101-103,105,107-109

  filter_bank: [[[8, 13], [13, 20], [20, 30]]]
  estimator: ["lwf"]
  sfreq: [160]
  eps: [1.0e-6]
  covariance_signal_scale: ["auto"]
  replace_covariance_diagonal_with_raw_energy: [true]
  brain_region_mode: ["physionet_8x8"]
  covariance_output_dtype: ["float32"]
  channels: [null]

  imaged: [true]
  executed: [false]
  task_types: [[unilateral_fist]]
  epoch_slice: [[-2.0, 4.0]]
  segment_slice: [[0.5, 0.25]]

  reject_threshold_uv: [null]
  use_ica: [false]
  ica_n_components: [20]
  ica_random_state: [42]
  ica_eog_channels: [""]
  use_autoreject: [false]
  autoreject_random_state: [42]
  autoreject_n_jobs: [1]
  autoreject_cv: [10]
  autoreject_cache_dir: "experiments/cache/autoreject_masks"
  autoreject_force_rebuild: false
  baseline_correction: [null]
  baseline_window: [null]

model:
  head_nums: [2]
  attention_dim: ["6, 4, 2"]
  # Required for the per-layer 8 -> 6 -> 4 -> 2 SPD reductions.
  stage_transition: [true]
  stage_projection_init: ["random"]
  add_norm_type: ["sequence_add_norm"]
  # SPDFeedForward is dimension-preserving; no hidden expansion is used.
  ffn_hidden_spd_dim: [null]
  tau: [1.3]
  metric: ["learnable-metric"]
  depth: [3]
  classifier_type: ["shape_power"]
  # Shape tokens use mean pooling; power is encoded by a small temporal CNN.
  pooling: ["mean"]
  power_hidden_dim: [16]
  power_feature_dim: [16]
  power_kernel_size: [5]
  power_dropout: [0.2]
  power_center_log: [true]
  fusion_classifier: ["cosine"]
  fusion_dropout: [0.2]
  cosine_initial_scale: [10.0]

  # Hyperparameter search values. Two values create two model candidates.
  dropout: [0.4,0.6]

  attention_dropout: [0.0]
  use_position_bias: [true]
  position_bias_axes: ["time"]
  position_bias_max: [0.5]
  attention_score_target_rms: [1.0]
  attention_score_clip: [5.0]
  layer_norm_affine: [false]
  learnable_metric_mode: ["low-rank"]
  learnable_metric_score: ["distance"]
  # Per-layer upper bound: effective ranks are 4, 4, and 3 respectively.
  learnable_metric_rank: [4]
  eps: [1.0e-6]

training:
  cv_n_splits: [5]
  # false gives deterministic, consecutive subject folds after sorting IDs.
  # Set true to use cv_seed for a reproducible shuffled subject assignment.
  cv_shuffle: [false]
  cv_seed: [42]

  # Fixed training only. Test data never controls epochs or learning rate.
  epochs: [100]
  batch_size: [128]
  precision: ["float32"]

  # The Cartesian product is used. With the current two dropout values and one
  # value for each learning rate, this defines 2 x 5 = 10 fold trainings.
  learning_rate: [0.002,]
  stiefel_learning_rate: [0.0003]

  # Epoch-based cosine decay is independent of fold test metrics, so it does
  # not leak test-subject information into training. Set ["none"] to disable.
  lr_scheduler: ["cosine"]
  lr_scheduler_t_max: [100]
  lr_scheduler_min_lr: [1.0e-5]
  stiefel_lr_scheduler_min_lr: [1.0e-6]
  weight_decay: [0.01]
  apply_weight_decay_to_special_parameters: [true]
  gradient_clip_norm: [0.8]
  condition_regularization_weight: [0.0]
  seed: [42]
  num_workers: [0]
  pin_memory: [true]
  allow_tf32: [false]

output:
  dir: experiments/results/physionet_global_cv_shape_power
  dataset_cache_dir: experiments/cache/preprocessed_datasets
  save_fold_checkpoints: false
