data:
  dataset: ["bnci2014_001"]
  root_dir: ["data"]
  # One filter-bank scheme with three motor-imagery bands.
  filter_bank: [[[8, 13], [13, 20], [20, 30]]]
  estimator: ["lwf"]
  sfreq: [250]
  eps: [1.0e-6]
  # MOABB's BNCI2014_001 output is already expressed in microvolts.
  covariance_signal_scale: ["auto"]
  replace_covariance_diagonal_with_raw_energy: [true]

  subjects: 1-9
  events: "left_hand,right_hand,feet,tongue"
  sessions: "all"
  channels: null

  # PhysioNet-style left/central/right motor regions, each with 7 channels.
  # Output SPD shape includes three region tokens of size 7 x 7.
  brain_region_mode: ["motor_7"]

  reject_threshold_uv: [null]
  # ICA and AutoReject are unavailable in the current MOABB array path.
  use_ica: [false]
  use_autoreject: [false]
  baseline_correction: [null]
  baseline_window: "0,1"
  epoch_slice: [[0.0, 4.0]]
  segment_slice: [[0.5, 0.25]]

  moabb_accept_terms: [true]
  moabb_force_update: [false]
  seed: [42]
  test_size: [0.2]
  allow_subject_overlap: [true, false]

model:
  head_nums: [4]
  # Region matrices are 7 x 7, so the Stiefel stage reduces 7 -> 6.
  attention_dim: ["6"]
  stage_transition: [true]
  stage_projection_init: ["random"]
  add_norm_type: ["sequence_add_norm"]
  ffn_hidden_spd_dim: [32]
  # Low-rank feature mixing in the same tangent dimension; 0 disables it.
  ffn_tangent_mixer_rank: [4]
  tau: [1.3]
  metric: ["learnable-metric"]
  # Set false to share one metric across time/frequency/region per layer.
  independent_metric_per_axis: [true]
  # Cross-layer sharing has no effect for this single-layer model.
  share_metric_across_layers: [false]
  depth: [1]
  classifier_type: ["mdm"]
  pooling: ["weighted"]
  pooling_weight_mode: ["factorized"]
  pooling_dropout: [0.1]
  pooling_uniform_mix: [0.1]
  pooling_mean_anchor: [true]
  dropout: [0.4]
  attention_dropout: [0.1]
  head_dropout: [0.1]
  use_position_bias: [true]
  position_bias_axes: ["time"]
  position_bias_max: [0.5]
  attention_score_target_rms: [1.0]
  attention_score_clip: [5.0]
  layer_norm_affine: [false]
  learnable_metric_mode: ["low-rank"]
  learnable_metric_score: ["distance"]
  learnable_metric_rank: [4]
  eps: [1.0e-6]

training:
  n_splits: [5]
  precision: ["float32"]
  epochs: [150]
  batch_size: [128]
  learning_rate: [0.0022]
  stiefel_learning_rate: [0.0003]
  lr_scheduler: ["plateau"]
  lr_scheduler_metric: ["test_macro_f1"]
  lr_scheduler_factor: [0.5]
  lr_scheduler_patience: [9]
  lr_scheduler_threshold: [0.0008]
  lr_scheduler_threshold_mode: ["abs"]
  lr_scheduler_min_lr: [1.0e-5]
  stiefel_lr_scheduler_min_lr: [1.0e-6]
  weight_decay: [0.01]
  apply_weight_decay_to_special_parameters: [true]
  gradient_clip_norm: [0.8]
  early_stopping_patience: [11]
  early_stopping_min_delta: [0.0008]
  condition_regularization_weight: [0.0]
  prototype_intra_weight: [0.001]
  prototype_inter_weight: [0.01]
  prototype_margin: [1.0]
  num_workers: [0]
  pin_memory: [true]
  allow_tf32: [true]

output:
  dir: experiments/results/spd_transformer_bci_iv_2a
  dataset_cache_dir: experiments/cache/preprocessed_datasets
