# PhysioNet preprocessing aligned to train_physionet_pretrain_finetune_motor_11x9.yaml.
# Same bands, trial window and segmentation; full-channel baseline spatial input.
data:
  dataset: ["physionet_mi"]
  root_dir: ["data/MNE-eegbci-data/files/eegmmidb/1.0.0"]

  # Same retained subject cohort as the 11x9 reference.
  subjects: 1-87,90-91,93-99,101-103,105,107-109
  # Exclude S088, S089, S092, S100, S104, and S106.

  # As in train_grid.yaml, one filter-bank candidate needs an extra list level.
  filter_bank: [[[5, 13], [13, 20], [20, 35]]]
  estimator: ["lwf"]
  sfreq: [160]
  eps: [1.0e-6]
  covariance_signal_scale: ["auto"]
  replace_covariance_diagonal_with_raw_energy: [true]
  # Baselines retain full 64-channel spatial coordinates, not region tokens.
  brain_region_mode: [null]
  covariance_output_dtype: ["float32"]
  channels: [null]

  imaged: [true]
  executed: [false]
  # Use [[unilateral_fist]] for two classes, or the setting below for four.
  task_types: [[unilateral_fist]]

  # Paired time fields follow train_grid.yaml's grid syntax.
  epoch_slice: [[-1.5, 3.5]]
  segment_slice: [[0.5, 0.25]]

  reject_threshold_uv: [null]
  use_ica: [false]
  ica_n_components: [20]
  ica_random_state: [42]
  ica_eog_channels: [""]
  use_autoreject: [false]
  autoreject_random_state: [42]
  autoreject_n_jobs: [1]
  autoreject_cv: [10]
  autoreject_cache_dir: "experiments/cache/autoreject_masks"
  autoreject_force_rebuild: false
  baseline_correction: [null]
  baseline_window: [null]

model:
  # Fixed, nonlearned input aggregation; the SPDNet network is unchanged.
  token_pooling: logeuclid_mean
  # Original SPDNet-style three-stage dimensionality reduction: 64->32->16->8.
  dims: [32, 16, 8]
  reig_epsilon: 1.0e-4
  log_epsilon: 1.0e-6
  project_stiefel: true

training:
  seed: [42]
  protocol: ["pretrain_finetune"]
  use_validation: [false]
  checkpoint_selection: ["last"]
  precision: ["float64"]
  # Same fixed epoch budget as SPDTransformer pretraining; SPDNet-specific SGD.
  epochs: [100]
  batch_size: [30]
  spdnet_optimizer: ["sgd"]
  spdnet_learning_rate: [0.01]
  spdnet_momentum: [0.0]
  spdnet_weight_decay: [0.0005]
  gradient_clip_norm: [5.0]
  lr_scheduler: ["multistep"]
  lr_scheduler_milestones: [[30, 60]]
  lr_scheduler_gamma: [0.5]
  log_every: [10]
  split_file: [null]
  num_workers: [0]

# Scalar stage settings (not a hyperparameter grid).
fine_tune:
  target_subjects: "all"
  split_strategy: leave_one_run_out
  use_validation: false
  checkpoint_selection: last
  epochs: 60
  batch_size: 30
  precision: float64
  spdnet_optimizer: sgd
  spdnet_learning_rate: 0.001
  spdnet_momentum: 0.0
  spdnet_weight_decay: 0.0005
  gradient_clip_norm: 5.0
  lr_scheduler: multistep
  lr_scheduler_milestones: [20, 35]
  lr_scheduler_gamma: 0.5
  log_every: 10
  num_workers: 0

output:
  dir: experiments/results/spdnet_pretrain_finetune_run_loo_physionet_final
