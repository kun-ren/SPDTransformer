data:
  dataset: ["bnci2014_001"]
  root_dir: ["data"]
  filter_bank:
    - [8, 30]
  eegnet_num_classes: [4]
  eegnet_T: [4.0]
  eegnet_downsample: [1]
  eegnet_n_channels: [22]
  eegnet_normalization: [0]
  sfreq: [250]
  subjects: 1-9
  events: "left_hand,right_hand,feet,tongue"
  sessions: "all"
  channels:
  reject_threshold_uv: [null]
  use_ica: [false]
  use_autoreject: [false]
  autoreject_random_state: [42]
  autoreject_n_jobs: [2]
  autoreject_cv: [10]
  baseline_correction: [null]
  epoch_slice: [[0.0, 4.0]]
  segment_slice: [[4.0, null]]
  moabb_accept_terms: [true]
  moabb_force_update: [false]
  test_size: [0.2]
  allow_subject_overlap: [true]

training:
  seed: [42]
  precision: ["float32"]
  epochs: [100]
  batch_size: [16]
  learning_rate: [0.01]
  learning_rate_schedule: ["0:0.01,20:0.001,50:0.0001"]
  weight_decay: [0.0]
  gradient_clip_norm: [0.0]
  dropout: [0.2]
  dropout_type: ["Dropout"]
  eegnet_num_filters: [8]
  eegnet_reg_rate: [0.25]
  input_scale: [1.0]
  split_file: [null]
  num_workers: [0]

output:
  dir: experiments/results/eegnet_baseline_bci_iv_2a
