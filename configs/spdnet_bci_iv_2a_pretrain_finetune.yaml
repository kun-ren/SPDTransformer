# All other subjects pretrain; target run-LOO adaptation restarts from that checkpoint.
# Fixed epochs, no validation; 22-channel input -> 16 -> 8 -> 4.
# Shared bands and temporal segmentation; baselines retain full-channel spatial input.
# Epoch [-1.5, 3.5] is cue-relative; the suite also generates [0, 3.5].
data:
  dataset: [bnci2014_001]
  root_dir: [data]
  filter_bank: [[[5, 13], [13, 20], [20, 35]]]
  estimator: [lwf]
  sfreq: [250]
  eps: [1.0e-06]
  covariance_signal_scale: [auto]
  replace_covariance_diagonal_with_raw_energy: [true]
  subjects: 1-9
  events: left_hand,right_hand,feet,tongue
  sessions: all
  channels: null
  brain_region_mode: [null]
  reject_threshold_uv: [null]
  use_ica: [false]
  use_autoreject: [false]
  baseline_correction: [null]
  baseline_window: [null]
  epoch_slice: [[-1.5, 3.5]]
  segment_slice: [[0.5, 0.25]]
  moabb_accept_terms: [true]
  moabb_force_update: [false]
  covariance_output_dtype: [float32]
model:
  token_pooling: logeuclid_mean
  dims: [16, 8, 4]
  reig_epsilon: 0.0001
  log_epsilon: 1.0e-06
  project_stiefel: true
training:
  seed: [42]
  protocol: [pretrain_finetune]
  use_validation: [false]
  checkpoint_selection: [last]
  precision: [float64]
  epochs: [100]
  batch_size: [30]
  spdnet_optimizer: [sgd]
  spdnet_learning_rate: [0.01]
  spdnet_momentum: [0.0]
  spdnet_weight_decay: [0.0005]
  gradient_clip_norm: [5.0]
  lr_scheduler: [multistep]
  lr_scheduler_milestones: [[30, 60]]
  lr_scheduler_gamma: [0.5]
  log_every: [10]
  split_file: [null]
  num_workers: [0]
fine_tune:
  target_subjects: all
  split_strategy: leave_one_run_out
  use_validation: false
  checkpoint_selection: last
  epochs: 60
  batch_size: 30
  precision: float64
  spdnet_optimizer: sgd
  spdnet_learning_rate: 0.001
  spdnet_momentum: 0.0
  spdnet_weight_decay: 0.0005
  gradient_clip_norm: 5.0
  lr_scheduler: multistep
  lr_scheduler_milestones: [20, 35]
  lr_scheduler_gamma: 0.5
  log_every: 10
  num_workers: 0
output:
  dir: experiments/results/spdnet_bci_iv_2a_pretrain_finetune_formal
