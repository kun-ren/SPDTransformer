data:
  root_dir: ["data/MNE-eegbci-data/files/eegmmidb/1.0.0"]
  filter_bank:
    - [8, 13]
    - [13, 20]
    - [20, 30]
  estimator: ["lwf"]
  sfreq: [160]
  eps: [1.0e-6]
  covariance_signal_scale: [1.0e6]
  replace_covariance_diagonal_with_raw_energy: [false]
  subjects: 1-87,89-109
  channels: "FC5, FC3, FC1, FCz, FC2, FC4, FC6, C5, C3, C1, Cz, C2, C4, C6, CP5, CP3, CP1, CPz, CP2, CP4, CP6"
  reject_threshold_uv: [null]
  use_ica: [false]
  ica_n_components: [13]
  ica_random_state: [42]
  ica_eog_channels: ["FP1,FP2"]
  use_autoreject: [true]
  autoreject_random_state: [42]
  autoreject_n_jobs: [2]
  autoreject_cv: [10]
  baseline_correction: [null]
  baseline_window: "-3,0"
  epoch_tmin: [0.0]
  epoch_tmax: [4.0]
  segment_duration: [0.5]
  stride_duration: [0.25]
  imaged: true
  executed: false
  task_types: unilateral_fist

training:
  seed: [42]
  precision: ["float32"]
  epochs: [50]
  batch_size: [64]
  spdnet_learning_rate: [0.001]
  spdnet_weight_decay: [0.0001]
  gradient_clip_norm: [1.0]
  test_size: [0.15]
  val_size: [0.15]
  allow_subject_overlap: [true]
  split_file: experiments/splits/physionet_mi_seed42.json
  num_workers: [0]

output:
  dir: experiments/results/spdnet_baseline
