data:
  dataset: ["bnci2014_001"]
  root_dir: ["data"]
  filter_bank:
    - [8, 30]
  estimator: ["lwf"]
  sfreq: [250]
  eps: [1.0e-6]
  covariance_signal_scale: ["auto"]
  replace_covariance_diagonal_with_raw_energy: [false]
  brain_region_mode: [null]
  subjects: 1-87,89-109
  events: "left_hand,right_hand"
  sessions: "all"
  channels: [null]
  reject_threshold_uv: [null]
  use_ica: [false]
  ica_n_components: [13]
  ica_random_state: [42]
  ica_eog_channels: ["FP1,FP2"]
  use_autoreject: [true]
  autoreject_random_state: [42]
  autoreject_n_jobs: [8]
  autoreject_cv: [10]
  baseline_correction: [null]
  baseline_window: "-3,0"
  epoch_slice: [[0.0, 4.0]]
  segment_slice: [[4.0, 4.0]]
  moabb_accept_terms: [true]
  moabb_force_update: [false]
  test_size: [0.2]
  allow_subject_overlap: [true]

model:
  classifier_type: ["fgmdm"]
  pooling: ["original"]
  metric_mean: ["riemann"]
  metric_distance: ["riemann"]
  metric_map: ["riemann"]
  fgmdm_tsupdate: [false]
  n_jobs: [6]

training:
  seed: [42]
  split_file: experiments/splits/bnci2014_001_mdm_test20_seed42.json

output:
  dir: experiments/results/fgmdm_bci_iv_2a
  dataset_cache_dir: experiments/cache/mdm_preprocessed_datasets
