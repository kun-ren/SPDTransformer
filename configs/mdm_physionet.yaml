data:
  dataset: ["physionet_mi"]
  root_dir: ["data/MNE-eegbci-data/files/eegmmidb/1.0.0"]
  filter_bank:
    - [8, 30]
  estimator: ["lwf"]
  sfreq: [160]
  eps: [1.0e-6]
  covariance_signal_scale: ["auto"]
  replace_covariance_diagonal_with_raw_energy: [false]
  brain_region_mode: [null]
  # Subjects evaluated independently: use 1 for one target or 1-10 for a batch.
  # S088, S089, S092, S100, S104, and S106 are excluded.
  subjects: 1-87,90-91,93-99,101-103,105,107-109
  #channels: "FC5, FC3, FC1, FCz, FC2, FC4, FC6, C5, C3, C1, Cz, C2, C4, C6, CP5, CP3, CP1, CPz, CP2, CP4, CP6"
  channels:
  reject_threshold_uv: [null]
  use_ica: [false]
  ica_n_components: [13]
  ica_random_state: [42]
  ica_eog_channels: ["FP1,FP2"]
  use_autoreject: [true]
  autoreject_random_state: [42]
  autoreject_n_jobs: [8]
  autoreject_cv: [10]
  baseline_correction: [null]
  baseline_window: "-3,0"
  epoch_slice: [[0.0, 4.0]]
  segment_slice: [[4.0, 4.0]]
  imaged: true
  executed: false
  task_types: unilateral_fist
  allow_subject_overlap: [true]

model:
  # Baseline AIRM-MDM is deliberately used: on large PhysioNet experiments it
  # was more reliable than FgMDM variants. LWF stabilizes 64x64 covariances.
  classifier_type: ["pyriemann"]
  pooling: ["original"]
  token_weight_logits: null
  metric_mean: ["riemann"]
  metric_distance: ["riemann"]
  n_jobs: [1]

training:
  seed: [42]
  # Each run is held out once and split approximately 50/50 into
  # validation/test. All other runs from the same subject are training data.
  held_out_run_validation_size: [0.5]
  # Fit class prototypes independently for every subject.
  subject_specific: [true]
  split_file: null
  # Used only by classifier_type="differentiable".
  epochs: [100]
  batch_size: [64]
  learning_rate: [0.01]
  weight_decay: [0.0]
  gradient_clip_norm: [1.0]
  early_stopping_patience: [12]
  early_stopping_min_delta: [0.0008]
  precision: ["float32"]
  num_workers: [0]
  pin_memory: [true]

output:
  dir: experiments/results/mdm_subject_specific_physionet
  dataset_cache_dir: experiments/cache/mdm_preprocessed_datasets
