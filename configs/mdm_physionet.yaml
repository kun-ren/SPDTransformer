data:
  dataset: ["physionet_mi"]
  root_dir: ["data/MNE-eegbci-data/files/eegmmidb/1.0.0"]
  filter_bank:
    - [8, 30]
  estimator: ["lwf"]
  sfreq: [160]
  eps: [1.0e-6]
  covariance_signal_scale: ["auto"]
  replace_covariance_diagonal_with_raw_energy: [false]
  brain_region_mode: [null]
  subjects: 1-87,89-109
  #channels: "FC5, FC3, FC1, FCz, FC2, FC4, FC6, C5, C3, C1, Cz, C2, C4, C6, CP5, CP3, CP1, CPz, CP2, CP4, CP6"
  channels:
  reject_threshold_uv: [null]
  use_ica: [false]
  ica_n_components: [13]
  ica_random_state: [42]
  ica_eog_channels: ["FP1,FP2"]
  use_autoreject: [true]
  autoreject_random_state: [42]
  autoreject_n_jobs: [8]
  autoreject_cv: [10]
  baseline_correction: [null]
  baseline_window: "-3,0"
  epoch_slice: [[0.0, 4.0]]
  segment_slice: [[4.0, 4.0]]
  imaged: true
  executed: false
  task_types: unilateral_fist
  test_size: [0.2]
  val_size: [0.0]
  allow_subject_overlap: [true]

model:
  # Change to "differentiable" for trainable Log-Euclidean prototypes.
  classifier_type: ["pyriemann"]
  pooling: ["original"]
  token_weight_logits: null
  metric_mean: ["riemann"]
  metric_distance: ["riemann"]

training:
  seed: [42]
  n_splits: [5]
  split_file: null
  # Used only by classifier_type="differentiable".
  epochs: [100]
  batch_size: [64]
  learning_rate: [0.01]
  weight_decay: [0.0]
  gradient_clip_norm: [1.0]
  precision: ["float32"]
  num_workers: [0]
  pin_memory: [true]

output:
  dir: experiments/results/mdm_baseline_physionet
  dataset_cache_dir: experiments/cache/mdm_preprocessed_datasets
