data:
  dataset: ["bnci2014_001"]
  root_dir: ["data"]
  filter_bank:
    - [8, 30]
  sfreq: [250]
  subjects: 1-9
  events: "left_hand,right_hand,feet,tongue"
  sessions: "all"
  channels: null
  reject_threshold_uv: [null]
  use_ica: [false]
  use_autoreject: [false]
  autoreject_random_state: [42]
  autoreject_n_jobs: [2]
  autoreject_cv: [10]
  baseline_correction: [null]
  epoch_slice: [[0.0, 4.0]]
  segment_slice: [[4.0, null]]
  moabb_accept_terms: [true]
  moabb_force_update: [false]
  test_size: [0.2]
  val_size: [0.0]
  allow_subject_overlap: [true, false]

model:
  n_components: 6
  mne_log_level: WARNING

training:
  seed: [42]
  n_splits: [5]

output:
  dir: experiments/results/csp_lda_baseline_bci_iv_2a
