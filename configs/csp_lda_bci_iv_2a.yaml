# Formal BCI IV-2a protocol aligned with the PhysioNet suite.
# Shared bands and temporal segmentation; baselines retain full-channel spatial input.
# Epoch [-1.5, 3.5] is cue-relative; the suite also generates [0, 3.5].
data:
  dataset: [bnci2014_001]
  root_dir: [data]
  filter_bank: [[[5, 13], [13, 20], [20, 35]]]
  estimator: [lwf]
  sfreq: [250]
  eps: [1.0e-06]
  covariance_signal_scale: [auto]
  replace_covariance_diagonal_with_raw_energy: [true]
  subjects: 1-9
  events: left_hand,right_hand,feet,tongue
  sessions: all
  channels: null
  brain_region_mode: [null]
  reject_threshold_uv: [null]
  use_ica: [false]
  use_autoreject: [false]
  baseline_correction: [null]
  baseline_window: [null]
  epoch_slice: [[-1.5, 3.5]]
  segment_slice: [[0.5, 0.25]]
  moabb_accept_terms: [true]
  moabb_force_update: [false]
  covariance_output_dtype: [float32]
training:
  seed: [42]
  n_splits: [5]
  subject_specific: [false]
  allow_subject_overlap: [false]
  subject_fold_method: [kfold]
  cv_shuffle: [true]
  val_size: [0.0]
model:
  input_mode: segmented_filterbank
  n_components: 6
  csp_reg: ledoit_wolf
  csp_log: true
  csp_norm_trace: false
  lda_solver: lsqr
  lda_shrinkage: auto
  mne_log_level: WARNING
output:
  dir: experiments/results/csp_lda_bci_iv_2a_formal
