data:
  # Dataset choices: "physionet_mi" or "bnci2014_001" (BCI Competition IV-2a).
  dataset: ["physionet_mi"]
  root_dir: ["data/MNE-eegbci-data/files/eegmmidb/1.0.0"]
  filter_bank:
    - [8, 30]
  estimator: ["lwf"]
  sfreq: [160]
  eps: [1.0e-6]
  covariance_signal_scale: ["auto"]
  # Classic SPDNet consumes a standard covariance matrix directly.
  replace_covariance_diagonal_with_raw_energy: [false]
  # Subjects evaluated independently: use 1 for one target or 1-10 for a batch.
  # S088 is omitted because it uses a different sampling rate.
  subjects: 1-87,89-109
  # BCI IV-2a uses a different 22-channel montage, so use
  # configs/spdnet_bci_iv_2a.yaml or clear/change channels when switching.
  # channels: "FC5, FC3, FC1, FCz, FC2, FC4, FC6, C5, C3, C1, Cz, C2, C4, C6, CP5, CP3, CP1, CPz, CP2, CP4, CP6"
  channels:
  reject_threshold_uv: [null]
  use_ica: [false]
  ica_n_components: [13]
  ica_random_state: [42]
  ica_eog_channels: ["FP1,FP2"]
  use_autoreject: [true]
  autoreject_random_state: [42]
  autoreject_n_jobs: [2]
  autoreject_cv: [10]
  baseline_correction: [null]
  baseline_window: "-3,0"
  # Use the complete 0--4 s motor-imagery trial as one covariance matrix.
  # segment_duration=stride_duration=epoch duration creates exactly one segment.
  epoch_slice: [[0.0, 4.0]]
  segment_slice: [[4.0, 4.0]]
  imaged: true
  executed: false
  # Match the CSP/MDM PhysioNet baselines: left-vs-right unilateral imagery.
  task_types: unilateral_fist
  # Subject-specific mode below guarantees subject isolation itself. Keep this
  # as a singleton so the grid does not launch duplicate equivalent jobs.
  allow_subject_overlap: [true]

model:
  # Original SPDNet-style three-stage dimensionality reduction: 64->32->16->8.
  dims: [32, 16, 8]
  reig_epsilon: 1.0e-4
  log_epsilon: 1.0e-6
  project_stiefel: true

training:
  seed: [42]
  # Train a fresh SPDNet independently for every subject/held-out-run split.
  subject_specific: [true]
  # Each run is held out once and split approximately 50/50 into
  # validation/test. All other runs from the same subject are training data.
  held_out_run_validation_size: [0.5]
  precision: ["float64"]
  epochs: [200]
  batch_size: [30]
  spdnet_optimizer: ["sgd"]
  spdnet_learning_rate: [0.01]
  spdnet_momentum: [0.0]
  spdnet_weight_decay: [0.0]
  gradient_clip_norm: [5.0]
  early_stopping_patience: [20]
  early_stopping_min_delta: [0.0008]
  log_every: [10]
  split_file: [null]
  num_workers: [0]

output:
  dir: experiments/results/spdnet_subject_specific_physionet
