name: spd_transformer

channels:
  - pytorch
  - nvidia
  - conda-forge
  - nodefaults

dependencies:
  # ---------- Python ----------
  - python=3.11
  - pip>=24.0

  # ---------- Core scientific stack ----------
  - numpy>=1.26,<2.0
  - scipy>=1.11
  - scikit-learn>=1.3

  # ---------- Visualization ----------
  - matplotlib>=3.8

  # ---------- Deep learning ----------
  - pytorch=2.5.1
  - pytorch-cuda=12.1

  # ---------- Experiment utilities ----------
  - pyyaml>=6.0

  # ---------- EEG / BCI / Riemannian geometry ----------
  # Install these with pip to avoid conda's optional MNE VTK/ffmpeg solve chain
  # and because MOABB is not available for this channel/platform combination.
  - pip:
      - mne>=1.6
      - moabb>=1.0
      - pyriemann>=0.6
      - autoreject
      - geoopt