name: spd_transformer

channels:
  - pytorch
  - nvidia
  - conda-forge
  - nodefaults

dependencies:
  # ---------- Python ----------
  - python=3.11
  - pip>=24.0

  # ---------- Core scientific stack ----------
  - numpy>=2.0,<3.0
  - scipy>=1.11,<2.0
  - pandas>=2.2,<3.0
  - scikit-learn>=1.6,<1.8
  - joblib>=1.4
  - threadpoolctl>=3.5

  # ---------- Visualization ----------
  - matplotlib>=3.8,<4.0
  - seaborn>=0.13,<0.14
  - tqdm>=4.66

  # ---------- EEG / BCI / Riemannian geometry ----------
  - mne>=1.10,<1.13
  - pyriemann>=0.11,<0.12
  - pooch>=1.8
  - pyedflib
  - edflib-python
  - edfio
  - pymatreader
  - mne-bids>=0.17
  - pybv>=0.7.3

  # ---------- Deep learning ----------
  - pytorch=2.5.1
  - pytorch-cuda=12.1

  # ---------- Experiment utilities ----------
  - pyyaml>=6.0
  - h5py>=3.10
  - pyarrow>=15
  - tensorboard
  - einops>=0.7
  - requests>=2.28
  - urllib3>=1.26
  - filelock>=3.18
  - memory-profiler>=0.61
  - pycountry>=24.6

  # ---------- Notebook support ----------
  - ipykernel

  # ---------- PyPI packages ----------
  - pip:
      - moabb==1.5.0