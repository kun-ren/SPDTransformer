name: spd_transformer
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # ---------- Python ----------
  - python=3.11
  - pip

  # ---------- Core scientific stack ----------
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - seaborn
  - tqdm
  - joblib

  # ---------- EEG preprocessing & BCI (Conda) ----------
  - mne>=1.6.0
  - pooch>=1.8.0
  - pyedflib
  - pyriemann

  # ---------- Deep learning ----------
  - pytorch
  - pytorch-cuda=12.1
  - torchvision
  - torchaudio

  # ---------- Experiment utilities ----------
  - pyyaml
  - h5py
  - pyarrow
  - tensorboard
  - einops

  # ---------- Packages from PyPI ----------
  - pip:
      - moabb